<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaryCocina.app - Receta</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600;700&family=Montserrat:wght@300;400;500;600&display=swap">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<section class="view active" id="view-detail">

    <div class="detail-container">

        <!-- NAV SUPERIOR -->
        <div class="detail-nav">

            <a class="back-btn"
               href="dashboard.html">

                <i class="fas fa-arrow-left"></i>
                Volver
            </a>

            <div class="brand" style="font-size:1.5rem;margin:0;">
                <span class="logo-mary">MaryCocina</span>
                <span class="logo-app">.app</span>
            </div>

            <div class="action-btns">

                <button class="btn-outline edit">
                    <i class="far fa-edit"></i>
                    Editar
                </button>

                <button class="btn-outline delete">
                    <i class="far fa-trash-alt"></i>
                    Borrar
                </button>

                <button class="btn-outline btn-save save-detail"
                   style="display:none">
                   <i class="fas fa-save"></i>
                   Guardar 
               </button>

              <button class="btn-outline btn-cancel cancel-edit"
                 style="display:none">
                <i class="fas fa-times"></i>
                Cancelar
              </button>

            </div>

        </div>

        <!-- HERO -->
        <div class="detail-hero">

            <div class="detail-img-wrap">

                <img class="detail-img"
                     src="https://mjomwvkhxohryhccpzku.supabase.co/storage/v1/object/public/Recetas/blanco.jpg"
                     alt="Imagen receta">

                  <input type="file"
                      accept="image/*"
                      class="detail-image-input"
                      style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;">

                <button class="btn-outline change-image-btn"
                        style="display:none">
                    Cambiar imagen
                </button>

                <div class="image-add-icon"
                     style="display:none"
                     title="Agregar imagen">

                    <i class="fas fa-camera"></i>

                </div>

            </div>

            <div class="detail-meta">

                <h1 class="detail-title"></h1>

                <input class="detail-title-input"
                       placeholder="Nombre de la receta"
                       style="display:none;font-size: 2.5rem;font-weight:700;">

                <div class="cat-badge">
                    <i class="fas fa-birthday-cake"></i>
                </div>

                <input class="detail-category-input"
                       placeholder="Categoría"
                       style="display:none;width: 100%;padding: 8px; margin-top: 8px;">

                <p class="detail-description"></p>

                <textarea class="detail-description-input"
                          placeholder="Descripcion de la receta"
                          style="display:none;width: 100%; min-height: 120px;padding: 8px; margin-top: 8px;">
                </textarea>

            </div>

        </div>

        <!-- INGREDIENTES -->
        <div class="section-box">

            <h2 class="section-title">
                <i class="fas fa-mortar-pestle"></i>
                Ingredientes
            </h2>

            <div class="section-content">

                <ul class="ingredients-list"></ul>

                <textarea class="detail-ingredients-input"
                          placeholder="Ingrese los ingredientes separados con coma"
                          style="display:none;width:100%;min-height:80px;margin-top:10px;padding:8px;">
                </textarea>

            </div>

        </div>

        <!-- PASOS -->
        <div class="section-box">

            <h2 class="section-title">
                <i class="fas fa-utensils"></i>
                Paso a paso
            </h2>

            <div class="section-content">

                <div class="steps-list"></div>

                <textarea class="detail-steps-input"
                          placeholder="Ingrese un paso debajo del otro"
                          style="display:none;width:100%;min-height:120px;margin-top:10px;padding:8px;">
                </textarea>

            </div>

        </div>

    </div>

</section>

<!-- JS específico del detalle -->
<script src="recipe.js"></script>

</body>
</html>
