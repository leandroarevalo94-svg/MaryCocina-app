<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaryCocina.app - Login</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600;700&family=Montserrat:wght@300;400;500;600&display=swap">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<section class="view active" id="view-login">

    <div class="card-auth">

        <div class="brand">
            <span class="logo-mary">MaryCocina</span>
            <span class="logo-app">.app</span>
        </div>

        <div class="tagline">
            Las recetas de la abuela
        </div>

        <div class="form-group">
            <label>Usuario</label>

            <div class="input-wrapper">
                <i class="far fa-user"></i>
                <input type="text" placeholder="Ingresá tu usuario">
            </div>
        </div>

        <div class="form-group">
            <label>Contraseña</label>

            <div class="input-wrapper">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="Ingresá tu contraseña">

                <i class="far fa-eye toggle-pwd"></i>
            </div>
        </div>

        <button class="btn-primary">Ingresar</button>

    </div>

    </div>

</section>

<script src="login.js"></script>

</body>
</html>
